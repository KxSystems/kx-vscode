# This workflow runs the tests across Linux, Mac, Windows

name: KX VScode CI Dev Testing

on:
  pull_request:
    branches:
      - dev
    paths-ignore: ["**/*.md"]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci
      - run: xvfb-run -a npm run coverage
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'

      - name: Code coverage summary
        if: runner.os == 'Linux'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./coverage-reports/cobertura-coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: true
          hide_complexity: true
          thresholds: "30 80"
          output: "both"

      - name: Write Coverage to Job Summary
        if: runner.os == 'Linux'
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Upload lcov result for app-sec job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage-reports/lcov.info
          retention-days: 1

      # Fork PRs get no secrets from the pull_request event, so the inline
      # app-sec job below is skipped for them. Capture the PR context here so
      # the secrets-enabled app-sec-forks.yml (workflow_run) can re-run app-sec.
      # Values go via env (not string-interpolated into the script) to avoid
      # shell injection from attacker-controlled ref/branch names.
      - name: Write PR metadata for fork app-sec
        if: runner.os == 'Linux' && github.event.pull_request.head.repo.fork
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p pr-meta
          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "PR_HEAD_REPO=${PR_HEAD_REPO}"
            echo "PR_HEAD_SHA=${PR_HEAD_SHA}"
            echo "PR_HEAD_REF=${PR_HEAD_REF}"
            echo "PR_BASE_REF=${PR_BASE_REF}"
          } > pr-meta/pr.env

      - name: Upload PR metadata for fork app-sec
        if: runner.os == 'Linux' && github.event.pull_request.head.repo.fork
        uses: actions/upload-artifact@v4
        with:
          name: pr-meta
          path: pr-meta/pr.env
          retention-days: 1

  test-q:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build q API
        run: node build-api.js
      - name: Login to GitLab
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GL_REG_USERNAME }}
          password: ${{ secrets.GL_REG_TOKEN }}
      - name: Run qCumber
        run: ./qcumber.sh -src test/q/main.q -test test/q/tests
        env:
          KDB_K4LICENSE_B64: ${{ secrets.KDB_K4LICENSE_B64 }}

  q-api:
    uses: ./.github/workflows/q-api.yml

  app-sec:
    needs: [test, test-q]
    if: "! github.event.pull_request.head.repo.fork "
    uses: ./.github/workflows/app-sec-template.yml
    with:
      github_ref: ${{ github.ref_name }}
    secrets: inherit
