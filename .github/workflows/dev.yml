# This workflow runs the tests across Linux, Mac, Windows

name: KX VScode CI Dev Testing

on:
  pull_request:
    branches:
      - dev
    paths-ignore: ["**/*.md"]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci
      - run: xvfb-run -a npm run coverage
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'

      - name: Code coverage summary
        if: runner.os == 'Linux'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./coverage-reports/cobertura-coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: true
          hide_complexity: true
          thresholds: "30 80"
          output: "both"

      - name: Write Coverage to Job Summary
        if: runner.os == 'Linux'
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Upload lcov result for app-sec job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage-reports/lcov.info
          retention-days: 1
  test-q:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GitLab
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secret.GL_REG_USERNAME }}
          password: ${{ secrets.GL_REG_TOKEN }}
      - name: Run qCumber
        run: ./qcumber.sh -src test/q/main.q -test test/q
        env:
          KDB_K4LICENSE_B64: ${{ secret.KDB_K4LICENSE_B64 }}
      

  app-sec:
    needs: test
    if: "! github.event.pull_request.head.repo.fork "
    uses: ./.github/workflows/app-sec-template.yml
    with:
      github_ref: ${{ github.ref_name }}
    secrets: inherit
