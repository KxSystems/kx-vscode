name: KX VScode Production Release Workflow

on:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+"

env:
  NODE_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build VSIX file
        run: npm run build
      - name: Run Tests
        run: xvfb-run -a npm run coverage
      - name: Packaging
        run: npm run package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDB-VSCode-Extension
          path: ./kdb-*vsix
          retention-days: 1
      - name: Upload lcov result for app-sec job
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage-reports/lcov.info
          retention-days: 1

  app-sec:
    needs: build
    uses: ./.github/workflows/app-sec-template.yml
    with:
      github_ref: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: app-sec
    runs-on: ubuntu-latest
    steps:
      - name: Set Tag Var
        id: vars
        run: |
          VERSION=${{ github.ref_name }}
          echo "run_tag=$(echo ${VERSION:1})" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download VSIX file from build job
        uses: actions/download-artifact@v4
        with:
          name: KDB-VSCode-Extension
      - name: Get Body
        run: |
          sed -n "/# ${{ github.ref_name }}/,/# v/{s/^# .*//;p;}" CHANGELOG.md > temp.md
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref_name }}
          body_path: ./temp.md
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: kdb-${{ steps.vars.outputs.run_tag }}.vsix
          asset_name: kdb-${{ steps.vars.outputs.run_tag }}.vsix
          asset_content_type: application/octet-stream

  manual-approval:
    needs: release
    environment:
      name: manual-approval
    runs-on: ubuntu-latest
    steps:
      - name: Manual Approval
        run: echo "Manually approved"

  publish-marketplace:
    needs: manual-approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set Tag Var
        id: vars
        run: echo "run_tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Download VSIX file from the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} --pattern "*.vsix" --clobber
      - name: Publish to VSCode Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate \
            -i kdb-${{ steps.vars.outputs.run_tag }}.vsix

  publish-openvsx:
    needs: manual-approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set Tag Var
        id: vars
        run: echo "run_tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Download VSIX file from the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} --pattern "*.vsix" --clobber
      - name: Check Open VSX for the version
        id: ovsx
        run: |
          URL=https://open-vsx.org/api/KX/kdb/${{ steps.vars.outputs.run_tag }}
          if curl -sf -o /dev/null "$URL"; then
            echo "::warning::${{ github.ref_name }} is already on Open VSX. Skipping publish."
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to Open VSX Registry
        if: steps.ovsx.outputs.published == 'false'
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: kdb-${{ steps.vars.outputs.run_tag }}.vsix
