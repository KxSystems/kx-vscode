name: Build q-api

on:
  workflow_call:

jobs:
  q-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: node build-api.js
      - uses: actions/upload-artifact@v4
        with:
          name: q-api
          path: out/vscode.q
          retention-days: 1
